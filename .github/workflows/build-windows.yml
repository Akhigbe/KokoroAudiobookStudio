name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Prepare source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Find a source ZIP anywhere in the repository, not just the root.
          $zips = @(Get-ChildItem -Path . -Filter "*-source.zip" -File -Recurse -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -notmatch "[\\/]source[\\/]" })
          if ($zips.Count -gt 1) {
            Write-Host "Found more than one source ZIP:"
            $zips | ForEach-Object { Write-Host " - $($_.FullName)" }
            throw "Keep exactly one *-source.zip in the repository. Delete old ZIPs and rerun."
          }
          $zip = $zips | Select-Object -First 1

          if ($zip) {
            Write-Host "Expanding $($zip.FullName) into source/"
            if (Test-Path source) { Remove-Item source -Recurse -Force }
            Expand-Archive -Path $zip.FullName -DestinationPath source -Force
          } else {
            Write-Host "No source ZIP found; looking for extracted source files."
            $bat = Get-ChildItem -Path . -Filter "build_windows.bat" -File -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -like "*\scripts\build_windows.bat" } |
                   Select-Object -First 1
            if ($bat) {
              $sourceDir = Split-Path (Split-Path $bat.FullName -Parent) -Parent
              Write-Host "Using extracted source folder: $sourceDir"
              if (Test-Path source) { Remove-Item source -Recurse -Force }
              New-Item -ItemType Directory -Path source | Out-Null
              Copy-Item -Path (Join-Path $sourceDir "*") -Destination source -Recurse -Force
            } else {
              Write-Host "Repository root contains:"
              Get-ChildItem -Force | Select-Object Name, Mode | Format-Table | Out-String | Write-Host
              throw "No *-source.zip and no scripts\\build_windows.bat found. Upload KokoroAudiobookStudio-0.1.0-source.zip to the repository root, then rerun the workflow."
            }
          }

          if (-not (Test-Path "source\scripts\build_windows.bat")) {
            Write-Host "Prepared source folder contains:"
            Get-ChildItem -Path source -Force | Select-Object Name, Mode | Format-Table | Out-String | Write-Host
            throw "source\scripts\build_windows.bat is missing. The uploaded ZIP is not the Kokoro source ZIP."
          }

      - name: Run pinned Windows build
        shell: pwsh
        working-directory: source
        run: .\scripts\build_windows.bat -SkipTests

      - name: Upload installer and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KokoroAudiobookStudio-Windows
          path: |
            source/dist/installer/*.exe
            source/dist/*.zip
            source/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            source/dist/installer/*.exe
            source/dist/*.zip
            source/dist/SHA256SUMS.txt
