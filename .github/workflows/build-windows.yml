name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Prepare source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zips = @(Get-ChildItem -Path . -Filter "*-source.zip" -File)
          if ($zips.Count -gt 1) {
            throw "More than one *-source.zip found in the repository root. Delete old source ZIPs and keep exactly one."
          }
          $zip = $zips | Select-Object -First 1
          if ($zip) {
            Write-Host "Expanding $($zip.Name) into source/"
            if (Test-Path source) { Remove-Item source -Recurse -Force }
            Expand-Archive -Path $zip.FullName -DestinationPath source -Force
          } else {
            Write-Host "No source ZIP found; using repository root files."
            if (Test-Path source) { Remove-Item source -Recurse -Force }
            New-Item -ItemType Directory -Path source | Out-Null
            Get-ChildItem -Force | Where-Object {
              $_.Name -notin @("source", ".git")
            } | Copy-Item -Destination source -Recurse -Force
          }
          if (-not (Test-Path "source\scripts\build_windows.bat")) {
            throw "source\scripts\build_windows.bat was not found. Upload the source ZIP or extracted files correctly."
          }

      - name: Run pinned Windows build
        shell: pwsh
        working-directory: source
        run: .\scripts\build_windows.bat -SkipTests

      - name: Upload installer and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KokoroAudiobookStudio-Windows
          path: |
            source/dist/installer/*.exe
            source/dist/*.zip
            source/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            source/dist/installer/*.exe
            source/dist/*.zip
            source/dist/SHA256SUMS.txt
